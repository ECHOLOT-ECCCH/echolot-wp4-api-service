[project]
name = "echolot-reconciliation"
version = "0.1.0"
description = "Entity reconciliation against Wikidata via Wikifier, orchestrated with Prefect"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.8",
    "fastapi>=0.110",
    "httpx>=0.27",
    "prefect>=3.7.5.dev5",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "uvicorn[standard]>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
